<script>
  document.addEventListener("DOMContentLoaded", function () {
    var parts = {
      user: [109, 111, 114, 103, 97, 110],
      domain: [109, 111, 114, 103, 97, 110, 103, 114, 97, 105, 110, 103, 101, 114, 46, 99, 111, 109]
    };

    var decode = function (codes) {
      return codes.map(function (code) {
        return String.fromCharCode(code);
      }).join("");
    };

    var email = decode(parts.user) + "@" + decode(parts.domain);

    document.querySelectorAll(".js-obfuscated-email a").forEach(function (link) {
      link.setAttribute("href", "mailto:" + email);
      link.setAttribute("title", email);
    });
  });
</script>
